<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mino works</title>
  <meta name="description" content="mino works の iPhone アプリ：花壇びより、イカたま！">
  <style>
    :root {
      --bg: #f6f5f1;
      --card: #ffffff;
      --text: #2b2b2b;
      --sub: #6b6b6b;
      --line: #e4e1d9;
      --link: #2f6fb3;
      --btn: #2b2b2b;
      --btn-text: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1b1b1d;
        --card: #26262a;
        --text: #ececec;
        --sub: #a8a8ae;
        --line: #3a3a40;
        --link: #8cb8ea;
        --btn: #ececec;
        --btn-text: #1b1b1d;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      line-height: 1.6;
    }
    .wrap {
      max-width: 560px;
      margin: 0 auto;
      padding: 40px 16px 32px;
    }
    header { margin-bottom: 24px; }
    h1 {
      font-size: 1.6rem;
      margin: 0;
      letter-spacing: 0.02em;
    }
    header p {
      margin: 4px 0 0;
      color: var(--sub);
      font-size: 0.95rem;
    }
    .app {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .app-head {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .app-head img {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      flex-shrink: 0;
      border: 1px solid var(--line);
    }
    .app-head div { min-width: 0; }
    h2 {
      font-size: 1.15rem;
      margin: 0;
    }
    .app-head p {
      margin: 2px 0 0;
      color: var(--sub);
      font-size: 0.9rem;
    }
    .store {
      display: block;
      margin-top: 14px;
      padding: 11px 12px;
      border-radius: 10px;
      background: var(--btn);
      color: var(--btn-text);
      text-align: center;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .links {
      list-style: none;
      margin: 12px 0 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 18px;
      font-size: 0.92rem;
    }
    .links a { color: var(--link); }
    footer {
      margin-top: 28px;
      color: var(--sub);
      font-size: 0.8rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>mino works</h1>
      <p>個人で作っている iPhone アプリ</p>
    </header>

    <section class="app">
      <div class="app-head">
        <img src="img/kadanbiyori.png" alt="花壇びより のアイコン" width="72" height="72">
        <div>
          <h2>花壇びより</h2>
          <p>解くたび、庭に花が咲くパズル</p>
        </div>
      </div>
      <a class="store" href="https://apps.apple.com/jp/app/id6817370603">App Store で見る</a>
      <ul class="links">
        <li><a href="https://mino-works.github.io/kadanbiyori-privacy/">プライバシーポリシー</a></li>
        <li><a href="https://mino-works.github.io/kadanbiyori-privacy/support.html">サポート・お問い合わせ</a></li>
      </ul>
    </section>

    <section class="app">
      <div class="app-head">
        <img src="img/ikatama.png" alt="イカたま！ のアイコン" width="72" height="72">
        <div>
          <h2>イカたま！</h2>
          <p>海の生き物を合体させるパズル</p>
        </div>
      </div>
      <a class="store" href="https://apps.apple.com/jp/app/id6761590585">App Store で見る</a>
      <ul class="links">
        <li><a href="/privacy-policy/">プライバシーポリシー</a></li>
      </ul>
    </section>

    <footer>&copy; mino works</footer>
  </div>
</body>
</html>
